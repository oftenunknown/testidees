name = "odyssey-token-server"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# The Odyssey TestFlight workflow deploys this for you (see Odyssey/README.md).
# By hand, set these with `npx wrangler secret put NAME`:
#   STRAVA_CLIENT_ID       your Strava API app's Client ID
#   STRAVA_CLIENT_SECRET   your Strava API app's Client Secret
#   ALLOWED_ATHLETE_IDS    optional, comma-separated Strava athlete IDs allowed to sign in
#                          (the workflow passes it as a plain variable from ODYSSEY_ALLOWED_ATHLETES)
