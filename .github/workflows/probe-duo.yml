name: Probe Duo simulator controls
on:
  push:
    paths: ['.github/workflows/probe-duo.yml']
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: simctl and XCTest fold/hinge APIs
        run: |
          xcrun simctl help 2>&1 | head -80
          echo "=== simctl ui help"; xcrun simctl ui 2>&1 | head -40 || true
          echo "=== simctl io help"; xcrun simctl io 2>&1 | head -40 || true
          DEV=$(xcode-select -p)
          echo "=== XCTest headers"
          find "$DEV/Platforms/iPhoneOS.platform/Developer/Library/Frameworks/XCTest.framework" -name "*.h" | head -50
          grep -rn -i -E "hinge|fold|posture|display(Mode|Configuration)|outerDisplay|innerDisplay|unfold" "$DEV/Platforms/iPhoneOS.platform/Developer/Library/Frameworks/XCTest.framework" --include=*.h | head -60 || true
          grep -rn -i -E "hinge|fold|posture" "$DEV/Platforms/iPhoneOS.platform/Developer/Library/Frameworks/XCTest.framework" --include=*.swiftinterface | head -40 || true
          echo "=== CoreSimulator duo device type"
          ls "/Library/Developer/CoreSimulator/Profiles/DeviceTypes" 2>/dev/null | grep -i duo || true
          find / -path /proc -prune -o -name "iPhone Duo*.simdevicetype" -print 2>/dev/null | head -3
          P=$(find / -path /proc -prune -o -name "iPhone Duo*.simdevicetype" -print 2>/dev/null | head -1)
          [ -n "$P" ] && find "$P" -name "*.plist" | head -5 && plutil -p "$P/Contents/Resources/profile.plist" 2>/dev/null | head -120
