name: Odyssey token server

# Tests the optional token server (Odyssey/backend). Deploying happens in the
# Odyssey TestFlight workflow, when the Cloudflare secrets are set.

on:
  push:
    paths:
      - "Odyssey/backend/**"
      - "!Odyssey/backend/**/*.md"
      - ".github/workflows/odyssey-backend.yml"
  pull_request:
    paths:
      - "Odyssey/backend/**"
      - "!Odyssey/backend/**/*.md"
      - ".github/workflows/odyssey-backend.yml"

jobs:
  test:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Odyssey/backend
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Odyssey/backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
