name: Odyssey CI

on:
  push:
    paths:
      - "Odyssey/**"
      - ".github/workflows/odyssey.yml"
      - "!Odyssey/**/*.md"
      - "!Odyssey/docs/**"
      - "!Odyssey/backend/**"
  pull_request:
    paths:
      - "Odyssey/**"
      - ".github/workflows/odyssey.yml"
  workflow_dispatch:

concurrency:
  group: odyssey-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Odyssey

jobs:
  kit-tests:
    name: OdysseyKit tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test --package-path Packages/OdysseyKit 2>&1 | tail -60

  app:
    name: Build & UI tests (iPhone 18 Pro, Pro Max, Duo, iPad mini)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Odyssey.xcodeproj -scheme Odyssey \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | xcbeautify --renderer github-actions || {
              echo "::group::Compiler errors"; grep -E "error:" build.log | sort -u | head -150; echo "::endgroup::"; exit 1; }

      - name: UI tests + screenshots
        run: |
          set -o pipefail
          # iPhone Duo boots closed (outer display) and CI tools can't unfold it;
          # iPad mini has the same regular/regular size classes as the Duo's
          # inner display, so it previews the unfolded spread layouts.
          for device in "iPhone 18 Pro" "iPhone 18 Pro Max" "iPhone Duo" "iPad mini (A17 Pro)"; do
            slug=$(echo "$device" | tr -cs 'A-Za-z0-9' '-' | sed 's/-$//')
            # The runner has 3 CPUs / 7 GB: one simulator at a time, fully booted first.
            xcrun simctl shutdown all || true
            udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; n=sys.argv[1]; print(next(d['udid'] for r in json.load(sys.stdin)['devices'].values() for d in r if d['name']==n))" "$device")
            xcrun simctl bootstatus "$udid" -b
            xcodebuild test-without-building \
              -project Odyssey.xcodeproj -scheme Odyssey \
              -destination "id=$udid" \
              -derivedDataPath build \
              -retry-tests-on-failure -test-iterations 2 \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 900 \
              -maximum-test-execution-time-allowance 1200 \
              -resultBundlePath "results/$slug.xcresult" 2>&1 | xcbeautify --renderer github-actions || echo "::warning::UI tests failed on $device"
            mkdir -p "screenshots/$slug"
            xcrun xcresulttool export attachments --path "results/$slug.xcresult" --output-path "screenshots/$slug" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odyssey-screenshots
          path: Odyssey/screenshots
          if-no-files-found: ignore
